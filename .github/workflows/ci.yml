name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_URL: https://www.saucedemo.com/
  CI: "true"
  HEADLESS: "true"

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install black flake8 isort

      - name: Run Black
        run: python -m black --check .

      - name: Run isort
        run: python -m isort --check-only .

      - name: Run Flake8
        run: python -m flake8 .

  tests:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: quality
    if: >-
      (matrix.suite == 'smoke' &&
      (github.event_name == 'pull_request' ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch')) ||
      (matrix.suite == 'regression' &&
      (github.event_name == 'push' ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch')) ||
      (matrix.suite == 'e2e' &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'))
    strategy:
      fail-fast: false
      matrix:
        suite:
          - smoke
          - regression
          - e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          mkdir -p reports
          mkdir -p reports/screenshots
          python -m pytest tests/specs \
            -m "${{ matrix.suite }}" \
            --maxfail=1 \
            --disable-warnings \
            -v \
            --html=reports/report.html \
            --junitxml=reports/results.xml \
            --self-contained-html

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.suite }}-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
