[pytest]
testpaths = tests/specs
pythonpath = .
python_files = test_*.py
addopts = -ra
markers =
    smoke: verificacoes essenciais para feedback rapido em integracao continua
    regression: validacoes de funcionalidades integradas
    e2e: jornadas completas e criticas do usuario
    login: cenarios de autenticacao e sessao
    cart: cenarios de carrinho de compras
    checkout: cenarios de checkout
    products: cenarios de catalogo e produtos
    purchase: jornada de compra
